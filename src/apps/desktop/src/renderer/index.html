<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jobpilot</title>
    <style>
      /* 兜底底色：脚本执行前也不出现白色闪屏 */
      html {
        background: #08080a;
      }
      html[data-theme='light'] {
        background: #f5f5f7;
      }
    </style>
    <script>
      // 首屏绘制前定主题：跟随系统时读 prefers-color-scheme。
      // 逻辑与 lib/theme.tsx 的 detectMode/resolveMode 保持一致，改一处要同步另一处。
      ;(() => {
        try {
          const saved = localStorage.getItem('jobpilot.theme')
          const mode = saved === 'light' || saved === 'dark' ? saved : 'system'
          const dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          const theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (err) {
          /* localStorage 不可用时按深色走，不影响启动 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
